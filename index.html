<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golden Palate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <h1>Golden Palate</h1>
        <p class="app-tagline">Fine dining delivered with a thoughtful, modern menu.</p>
      </div>
      <div class="header-actions">
        <button id="nav-home" class="nav-button">Home</button>
        <button id="nav-menu" class="nav-button">Menu</button>
        <button id="nav-cart" class="nav-button">Cart <span id="cart-count">0</span></button>
        <button id="nav-history" class="nav-button">Orders</button>
        <button id="nav-profile" class="nav-button">Profile</button>
      </div>
    </header>

    <main id="app-root" class="app-root"></main>

    <footer class="app-footer">
      <p>Frontend-only restaurant ordering demo · No backend required · LocalStorage powered</p>
    </footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app-state.js"></script>
  <script src="js/app-utils.js"></script>
  <script src="js/app-actions.js"></script>
  <script src="js/app-views.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
